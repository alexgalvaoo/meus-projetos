<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulário de Inscrição</h1>

    <form>
        <label for="name">Nome:</label>
        <br>
        <input type="text" id ="name" name="name" required placeholder="Digite seu Nome..."> 

        <br> <br>

        <label for="email">Email:</label>
        <br>
        <input type="email" id="email" name="email" required placeholder="Digite seu Email...">

        <br> <br>

        <label for="numero">WhatsAp:</label>
        <br> 
        <input type="number" id="numero" name="numero" required placeholder="Digite seu Número...">

        <br> <br>

        <label for="AreaDeAtuacao">Área de Atuação:</label>
        <br>

        <input type="radio" name="area" value="desenvolvimento">
        <label for="desenvolvimento">Desenvolvimento</label>
       
        <input type="radio" name="area" value="qa">
        <label for="qa">Quality Assurance(QA)</label>
        
        <input type="radio" name="area" value="analistadedados">
        <label for="analistadedados">Analista de Dados</label>

        <input type="radio" name="area" value="infraestrutura">
        <label for="infraestrutura">Infraestrutura</label>

        <br> <br>
        
        <label for="observacoes">Observações:</label>
        <br>
        <textarea id="observacoes" name="observacoes" placeholder="Digite algo aqui..." cols="30" rows="3"></textarea>

        <br> <br>

        <input type="checkbox" id="receber_novidades" name="receber_novidades" value="sim">
        <label for="receber_novidades">Desejo Receber novidades e ofertas por email.</label>

        <br>

        <input type="submit" value="Enviar">
        
    </form>

</body>
</html>
